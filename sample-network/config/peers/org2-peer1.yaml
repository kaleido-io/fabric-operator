---
apiVersion: ibp.com/v1beta1
kind: IBPPeer
metadata:
  name: org2-peer1
spec:
  imagePullSecrets:
    - ecr-creds
  version: "${FABRIC_VERSION}"
  domain: "${INGRESS_DOMAIN}"
  peerExternalEndpoint: "test-network-org2-peer1-peer.${INGRESS_DOMAIN}:443"
  license:
    accept: true
  action:
    enroll: {}
    reenroll: {}
  configoverride:
    peer:
      keepalive:
        # Must be < the chaincode shim's ~60s keepalive ping, or an idle
        # chaincode connection is dropped with GOAWAY/ENHANCE_YOUR_CALM
        # (too_many_pings). 15s also stays below the peer's 30s delivery/gossip
        # client pings.
        minInterval: 15s
    chaincode:
      # The Kaleido peer image ships the chaincode_builder client at
      # /opt/hyperledger/chaincode_builder; the operator's default core.yaml uses
      # the legacy IBP path /usr/local, so the ibp-builder external builder is
      # skipped and golang chaincode installs fall through to a disabled docker
      # build. Override the path here. MergeWith (mergo) overwrites the whole
      # slice, so all three builders must be listed. See
      # fabric-adoption-pipeline/docs/k8s-chaincode-builder-gate.md.
      externalBuilders:
        - name: ibp-builder
          path: /opt/hyperledger/chaincode_builder
          environmentWhiteList:
            - IBP_BUILDER_ENDPOINT
            - IBP_BUILDER_SHARED_DIR
          propagateEnvironment:
            - IBP_BUILDER_ENDPOINT
            - IBP_BUILDER_SHARED_DIR
            - PEER_NAME
        - name: k8s_builder
          path: /opt/hyperledger/k8s_builder
          propagateEnvironment:
            - CORE_PEER_ID
            - KUBERNETES_SERVICE_HOST
            - KUBERNETES_SERVICE_PORT
        - name: ccaas-builder
          path: /opt/hyperledger/ccaas_builder
          propagateEnvironment:
            - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG
  customNames:
    pvc: {}
  images:
    peerInitImage: ${INIT_IMAGE}
    peerInitTag: ${INIT_IMAGE_LABEL}
    peerImage: ${PEER_IMAGE}
    peerTag: ${PEER_IMAGE_LABEL}
    grpcwebImage: ${GRPCWEB_IMAGE}
    grpcwebTag: ${GRPCWEB_IMAGE_LABEL}
    couchdbImage: ${COUCHDB_IMAGE}
    couchdbTag: ${COUCHDB_IMAGE_LABEL}
    chaincodeLauncherImage: ${CHAINCODE_LAUNCHER_IMAGE}
    chaincodeLauncherTag: ${CHAINCODE_LAUNCHER_IMAGE_LABEL}
    fileTransferImage: ${FILETRANSFER_IMAGE}
    fileTransferTag: ${FILETRANSFER_IMAGE_LABEL}
    builderImage: ${BUILDER_IMAGE}
    builderTag: ${BUILDER_IMAGE_LABEL}
    goEnvImage: ${GOENV_IMAGE}
    goEnvTag: ${GOENV_IMAGE_LABEL}
  mspID: Org2MSP
  mspSecret: org2-peer1-secret
  secret:
    enrollment:
      component:
        caname: ca
        cahost: "test-network-org2-ca-ca.${INGRESS_DOMAIN}"
        caport: "443"
        catls:
          cacert: "${ORG2_CA_CERT}"
        enrollid: "peer1"
        enrollsecret: "peer1pw"
      tls:
        caname: tlsca
        cahost: "test-network-org2-ca-ca.${INGRESS_DOMAIN}"
        caport: "443"
        catls:
          cacert: "${ORG2_CA_CERT}"
        enrollid: "peer1"
        enrollsecret: "peer1pw"
        csr:
          hosts:
            - "org2-peer1"
            - "org2-peer1.${KUBE_DNS_DOMAIN}"
  chaincodeBuilderConfig:
    peername: org2-peer1
  service:
    type: ClusterIP
  stateDb: leveldb
  storage:
    peer:
      class: "${STORAGE_CLASS}"
      size: 5G
    statedb:
      class: "${STORAGE_CLASS}"
      size: 10Gi
  resources:
    init:
      limits:
        cpu: 100m
        memory: 200M
      requests:
        cpu: 10m
        memory: 10M
    peer:
      limits:
        cpu: 500m
        memory: 1G
      requests:
        cpu: 10m
        memory: 10M
    proxy:
      limits:
        cpu: 100m
        memory: 200M
      requests:
        cpu: 10m
        memory: 10M